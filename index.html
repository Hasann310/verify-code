<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Code - Icon Sheet Builder</title>
    <style>
        body { background: #1e1e1e; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #252525; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 90%; border: 1px solid rgba(255,255,255,0.1); }
        h2 { margin-top: 0; color: #ff9f0a; font-size: 20px; }
        p { color: #aaa; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        .code-box { background: #111; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 24px; color: #0a84ff; letter-spacing: 2px; margin-bottom: 20px; border: 1px dashed #333; word-break: break-all; }
        .btn-copy { background: linear-gradient(180deg, #27c93f 0%, #1e9d31 100%); color: white; border: none; padding: 14px 24px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .btn-copy:hover { filter: brightness(1.1); }
        .btn-copy:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎉 Verification Successful!</h2>
        <p>Thank you for supporting us. Copy your unique redeem code below and paste it in the extension to get 1 Free Trial Credit.</p>
        <div class="code-box" id="displayCode">LOADING...</div>
        <button class="btn-copy" onclick="copyCode()" id="copyBtn">📋 COPY REDEEM CODE</button>
    </div>

    <script>
        // URL থেকে কোড বের করার ম্যাজিক!
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const codeBox = document.getElementById('displayCode');

        if(code) {
            codeBox.innerText = code;
        } else {
            codeBox.innerText = "INVALID LINK";
            codeBox.style.color = "#ff5f56";
            document.getElementById('copyBtn').style.display = "none";
        }

        function copyCode() {
            if(code) {
                navigator.clipboard.writeText(code);
                const btn = document.getElementById('copyBtn');
                btn.innerText = "✅ COPIED SUCCESSFULLY!";
                btn.style.background = "linear-gradient(180deg, #0a84ff 0%, #007aff 100%)";
                setTimeout(() => {
                    btn.innerText = "📋 COPY REDEEM CODE";
                    btn.style.background = "linear-gradient(180deg, #27c93f 0%, #1e9d31 100%)";
                }, 3000);
            }
        }
    </script>
</body>
</html>
